# Intentionally empty so pnpm treats docs/ as an isolated workspace root
# and does not traverse into the parent uv/Python workspace.
packages: []

# Native deps that need to run install scripts. Both are build-time
# requirements: esbuild is Astro's bundler; sharp powers Astro's image
# pipeline. pnpm 10+ blocks scripts by default — approving here keeps CI
# from hitting ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  sharp: true

overrides:
  esbuild: ">=0.28.1"
  dompurify: ">=3.4.12"
  js-yaml: "4.3.0"
  svgo: ">=4.0.2"
  postcss: ">=8.5.18"
