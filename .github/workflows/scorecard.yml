# ──────────────────────────────────────────────────────────────
# OpenSSF Scorecard — supply-chain security assessment
# ──────────────────────────────────────────────────────────────
# Evaluates the repo against OpenSSF best practices and publishes
# the score to the GitHub Security tab.
# All third-party actions are pinned by commit SHA.
# ──────────────────────────────────────────────────────────────
name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    # Every Monday at 07:30 UTC
    - cron: "30 7 * * 1"

permissions:
  contents: read
  actions: read

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write # Upload SARIF
      id-token: write # Publish results
      contents: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@7211b7c8077ea37d8641b6271f6a365a22a5fbfa # v4
        with:
          sarif_file: scorecard-results.sarif
          category: scorecard
