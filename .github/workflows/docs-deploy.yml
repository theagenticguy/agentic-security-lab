# ──────────────────────────────────────────────────────────────
# Documentation — sync ADRs, build Starlight, deploy to Pages
# ──────────────────────────────────────────────────────────────
# All third-party actions are pinned by commit SHA.
# ──────────────────────────────────────────────────────────────
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "adr/**"
      - "scripts/sync_adrs.py"
      - ".github/workflows/docs-deploy.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "adr/**"
      - "scripts/sync_adrs.py"
      - ".github/workflows/docs-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6
        with:
          enable-cache: true

      - name: Sync ADR mirror into docs
        run: uv run python scripts/sync_adrs.py

      - name: Install, build, and upload site
        uses: withastro/action@e84f40bd8d2caa9e768ec82ad30dd81f0b280853 # v6
        with:
          path: docs
          node-version: 22
          package-manager: pnpm@10

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only push and workflow_dispatch deploy. PR runs build the site (so a
    # broken build blocks the PR) but skip the deploy step — Pages has one
    # production environment and PR builds are previews, not deploys.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
