# ──────────────────────────────────────────────────────────────
# Security — OpenSSF-baseline scanners
# ──────────────────────────────────────────────────────────────
# gitleaks, dependency-review (PR only), bandit, pip-audit,
# osv-scanner, and trivy fs (SARIF upload).
# All third-party actions are pinned by commit SHA.
# ──────────────────────────────────────────────────────────────
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 6 * * 1"

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    # gitleaks-action v2.x calls the GitHub API for PR commits; it needs read
    # access to pull-requests + a wider checkout. v3.0.0 (dependabot PR #3) drops
    # that requirement; once that's merged this `permissions` block can revert.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review (PR only)
    runs-on: ubuntu-latest
    # Requires GHAS on private repos. Auto-enables when public.
    if: ${{ github.event_name == 'pull_request' && github.event.repository.visibility == 'public' }}
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  bandit:
    name: bandit (Python SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v6
        with:
          enable-cache: true
      - name: Run bandit
        # Scan library + app source only (tests excluded — B101 fires on every
        # pytest assert). Gate on Medium+ severity; Low findings (B101 in retry
        # loops, B404/B603 for the LocalSandbox subprocess, etc.) get reviewed
        # in PR but don't block CI on substrate code that intentionally
        # spawns subprocesses.
        run: uv run --with bandit bandit -r packages apps
          -x '*/tests/*,*/test_*.py,*/fixtures/*,*/adversarial/*'
          --severity-level medium

  pip-audit:
    name: pip-audit (dependency CVEs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v6
        with:
          enable-cache: true
      - name: Run pip-audit
        run: uv run --with pip-audit pip-audit

  # osv-scanner uploads SARIF to GitHub Code Scanning, which requires GitHub
  # Advanced Security on private repos. Gate on visibility — auto-enables when
  # we flip the repo public, same pattern as the Scorecard workflow.
  osv-scanner-public-only:
    name: osv-scanner (public repos only)
    if: ${{ github.event.repository.visibility == 'public' }}
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --recursive
        ./

  trivy:
    name: trivy fs (SARIF upload)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
      - name: Upload Trivy SARIF
        # SARIF upload to GitHub Code Scanning requires Advanced Security on
        # private repos. The scan above runs unconditionally and fails the
        # job if HIGH/CRITICAL findings are present (see exit-code default);
        # uploading is just for the Security tab UI, which doesn't exist on
        # private without GHAS. Auto-enables when we flip the repo public.
        if: ${{ github.event.repository.visibility == 'public' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs
