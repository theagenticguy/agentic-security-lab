# ──────────────────────────────────────────────────────────────
# Dependency Review — PR-time vulnerability & license gate
# ──────────────────────────────────────────────────────────────
# Scans dependency changes in a PR for known vulnerabilities and
# problematic licenses before they land on main.
# All third-party actions are pinned by commit SHA.
# ──────────────────────────────────────────────────────────────
name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later
          comment-summary-in-pr: always
          warn-only: false
