# ──────────────────────────────────────────────────────────────
# Release — commitizen-managed version bump, tag, CHANGELOG
# ──────────────────────────────────────────────────────────────
# On tag push (vX.Y.Z): build distributions and publish a GitHub
# Release. CHANGELOG is maintained by commitizen (cz bump).
# All third-party actions are pinned by commit SHA.
# ──────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release + push tag/changelog
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v6
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --locked --all-packages

      - name: Build distributions
        run: uv build --all-packages

      - name: Extract changelog for this tag
        run: uv run cz changelog --dry-run "${GITHUB_REF_NAME}" > release-notes.md || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v2
        with:
          body_path: release-notes.md
          files: dist/*
