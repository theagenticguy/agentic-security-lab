# ──────────────────────────────────────────────────────────────
# Release — commitizen-managed version bump, tag, CHANGELOG
# ──────────────────────────────────────────────────────────────
# On tag push (vX.Y.Z): build distributions and publish a GitHub
# Release. CHANGELOG is maintained by commitizen (cz bump).
# All third-party actions are pinned by commit SHA.
# ──────────────────────────────────────────────────────────────
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write # create the GitHub Release + push tag/changelog
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v6
        with:
          enable-cache: true

      - name: Sync workspace
        run: uv sync --locked --all-packages

      - name: Build distributions
        run: uv build --all-packages

      - name: Extract changelog for this tag
        run: uv run cz changelog --dry-run "${GITHUB_REF_NAME}" > release-notes.md || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2
        with:
          body_path: release-notes.md
          files: dist/*
