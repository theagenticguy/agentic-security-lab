# ──────────────────────────────────────────────────────────────
# CDK Nag — synth + assert no un-suppressed findings remain
# ──────────────────────────────────────────────────────────────
# Synthesizes the CDK app, then verifies cdk.out has no
# un-suppressed CDK Nag findings. Uploads the Nag report.
# All third-party actions are pinned by commit SHA.
# ──────────────────────────────────────────────────────────────
name: CDK Nag

on:
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/cdk-nag.yml"
  pull_request:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/cdk-nag.yml"

permissions:
  contents: read

jobs:
  cdk-nag:
    name: Synth + CDK Nag
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v4.0.1
        with:
          install: true
          cache: true

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v6
        with:
          enable-cache: true

      - name: Setup Node (CDK CLI)
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22

      - name: Install CDK CLI
        # The `cdk` binary isn't bundled with Node — install via npm before synth.
        run: npm install -g aws-cdk@2

      - name: Sync workspace
        run: uv sync --locked --all-packages

      - name: CDK synth
        run: mise run cdk:synth

      - name: Assert no un-suppressed CDK Nag findings
        run: |
          # CDK Nag annotations land in cdk.out as AwsSolutions-* metadata.
          # Any un-suppressed Error-level finding fails the gate. Encryption
          # and public-access rules may never be suppressed (PLAN §7).
          if grep -rlE "AwsSolutions-[A-Z0-9]+.*\[Error\]" infra/cdk/cdk.out 2>/dev/null; then
            echo "::error::Un-suppressed CDK Nag findings remain in cdk.out"
            exit 1
          fi
          echo "No un-suppressed CDK Nag findings."

      - name: Upload CDK Nag report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cdk-nag-report
          path: infra/cdk/cdk.out
          if-no-files-found: ignore
