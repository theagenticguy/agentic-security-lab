# ──────────────────────────────────────────────────────────────
# CodeQL — GitHub's semantic code analysis (Python)
# ──────────────────────────────────────────────────────────────
# Runs on push/PR to main and on a weekly schedule so results
# stay fresh during quiet periods.
# All third-party actions are pinned by commit SHA.
# ──────────────────────────────────────────────────────────────
name: CodeQL Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "15 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # CodeQL needs Code Scanning, which on private repos requires GitHub
    # Advanced Security. Gate on visibility — auto-enables when public.
    if: ${{ github.event.repository.visibility == 'public' || github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python]
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: ${{ matrix.language }}
          queries: +security-extended,security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Autobuild
        uses: github/codeql-action/autobuild@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: /language:${{ matrix.language }}
          # Don't try to upload on private (GHAS-locked); flip to always when public.
          upload: ${{ github.event.repository.visibility == 'public' && 'always' || 'never' }}
