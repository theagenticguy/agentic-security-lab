[project]
name = "infra-cdk"
version = "0.1.0"
requires-python = ">=3.13"
description = "AWS CDK (Python) substrate stack with CDK Nag for the security lab."
dependencies = [
    "aws-cdk-lib>=2.180.0",
    "constructs>=10.0.0,<11.0.0",
    "cdk-nag>=2.27",
    "pydantic>=2.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stacks"]
