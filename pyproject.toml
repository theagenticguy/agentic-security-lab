[project]
name = "agentic-security-lab"
version = "0.1.0"
requires-python = ">=3.13"

[tool.uv.workspace]
members = ["packages/*", "apps/*", "infra/cdk"]

[tool.uv.sources]
asec-core         = { workspace = true }
asec-sandbox      = { workspace = true }
asec-memory       = { workspace = true }
asec-skills       = { workspace = true }
asec-threat-model = { workspace = true }
asec-confidence   = { workspace = true }

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "pytest-cov", "hypothesis",
       "atheris", "pyright", "ruff", "commitizen",
       "boto3", "boto3-stubs[bedrock-runtime]"]
# NOTE: osv-scanner is a standalone Go binary (installed via mise/trivy), not on PyPI.
security = ["bandit", "pip-audit", "checkov"]

[tool.ruff]
target-version = "py313"
# The adversarial canary corpus is intentionally-vulnerable substrate (planted
# CWEs, hardcoded fake secrets, %-formatted SQL). Lint the harness (runner.py /
# test_adversarial.py) but not the planted-bug source files themselves.
# force-exclude so the corpus is skipped even when ruff is invoked with explicit
# paths (e.g. `ruff check tests/`), not just on a bare `ruff check .`.
force-exclude = true
extend-exclude = [
    "tests/adversarial/honey_bugs",
    "tests/adversarial/prompt_injection",
    "tests/adversarial/honey_secrets",
    "tests/adversarial/tool_canaries",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pyright]
typeCheckingMode = "strict"
# scripts/ is operational glue (one-off invocations against external services
# with dynamically-dispatched clients like boto3). The strict bar is reserved
# for library + app code where it pays for itself.
exclude = [
    "scripts",
    "**/__pycache__",
    ".venv",
    "infra/cdk/cdk.out",
    # Intentionally-vulnerable demo corpus (Flask handlers, flask not a workspace dep).
    # Excluded from bandit + pyright; it is test fixture data, not substrate code.
    "apps/pr-reviewer/fixtures",
    # Intentionally-adversarial canary corpus (planted bugs, secrets, injection
    # strings). Adversarial test substrate, not substrate code.
    "tests/adversarial",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_files = ["pyproject.toml:version"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "infra/cdk", "tests"]
# importlib mode lets identically-named test modules (test_smoke.py) coexist across
# the workspace without package-name collisions.
# `-m "not live"` keeps CI off the network: the live Bedrock E2E test is opt-in via
# `RUN_LIVE_BEDROCK=1 uv run pytest -m live`.
addopts = "-q --cov-report=term --cov-report=xml --import-mode=importlib -m \"not live\""
asyncio_mode = "auto"
markers = [
    "live: end-to-end tests that hit real Bedrock (skipped unless RUN_LIVE_BEDROCK=1)",
    "adversarial: the §16 honey-bug / injection / secret / tool-call canary corpus.",
]

[tool.coverage.run]
source = ["packages", "apps"]
