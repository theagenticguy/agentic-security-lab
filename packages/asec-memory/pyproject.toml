[project]
name = "asec-memory"
version = "0.1.0"
requires-python = ">=3.13"
description = "Hypothesis board + findings ledger + SARIF v2.1 output (with x-bonk extension)."
dependencies = [
    "asec-core",
    "pydantic>=2.7",
    "aiosqlite",
    "structlog",
    "opentelemetry-api",
    "sarif-tools",
]

[project.optional-dependencies]
aioboto3 = ["aioboto3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asec_memory"]
