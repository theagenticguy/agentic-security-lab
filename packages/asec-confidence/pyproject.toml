[project]
name = "asec-confidence"
version = "0.1.0"
requires-python = ">=3.13"
description = "Three-axis confidence scorer (pattern, recall, reachability) with bm25s lexical recall."
dependencies = [
    "asec-core",
    "pydantic>=2.7",
    "bm25s",
    "structlog",
    "opentelemetry-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asec_confidence"]
