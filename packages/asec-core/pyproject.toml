[project]
name = "asec-core"
version = "0.1.0"
requires-python = ">=3.13"
description = "Orchestrator + provider-abstract AgentRuntime seam + governance for the security substrate."
dependencies = [
    "claude-agent-sdk",
    "pydantic>=2.7",
    "pydantic-settings>=2",
    "structlog>=24",
    "opentelemetry-api>=1.27",
    "cryptography>=43",
    "cyclopts>=3",
    "asec-memory",
    "asec-sandbox",
    "asec-threat-model",
    "asec-skills",
    "anyio>=4.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asec_core"]

[tool.uv.sources]
asec-memory = { workspace = true }
asec-sandbox = { workspace = true }
asec-threat-model = { workspace = true }
asec-skills = { workspace = true }
