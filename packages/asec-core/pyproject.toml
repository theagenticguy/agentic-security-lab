[project]
name = "asec-core"
version = "0.1.0"
requires-python = ">=3.13"
description = "Orchestrator + provider-abstract AgentRuntime seam + governance for the security substrate."
dependencies = [
    "claude-agent-sdk",
    "pydantic>=2.7",
    "pydantic-settings",
    "structlog",
    "opentelemetry-api",
    "cyclopts",
    "cryptography",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asec_core"]
