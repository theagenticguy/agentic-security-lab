[project]
name = "asec-sandbox"
version = "0.1.0"
requires-python = ">=3.13"
description = "Isolated target-code execution + hash-chained WORM audit writer."
dependencies = [
    "asec-core",
    "pydantic>=2.7",
    "anyio>=4",
    "structlog>=24",
    "opentelemetry-api>=1.44.0",
    "python-on-whales>=0.81.0",
]

[project.optional-dependencies]
boto3 = ["boto3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asec_sandbox"]
