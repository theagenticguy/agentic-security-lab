[project]
name = "asec-threat-model"
version = "0.1.0"
requires-python = ">=3.13"
description = "Phase-Zero threat-model artifacts: Asset/Threat/ThreatModel with stable round-trip + diff."
dependencies = [
    "asec-core",
    "pydantic>=2.7",
    "pyyaml",
    "structlog",
    "opentelemetry-api",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asec_threat_model"]
