[project]
name = "nightly-variant-hunter"
version = "0.1.0"
requires-python = ">=3.13"
description = "Big-Sleep nightly variant analysis: ingest recent git history, seed bug shapes, then hunt for variants across the repo. Wiring only; NOT production-grade."
dependencies = [
    "asec-core",
    "asec-sandbox",
    "asec-memory",
    "asec-skills",
    "asec-threat-model",
    "asec-confidence",
    "cyclopts",
    "anyio",
]

[project.scripts]
nightly-variant-hunter = "nightly_variant_hunter.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nightly_variant_hunter"]
