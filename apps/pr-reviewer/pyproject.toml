[project]
name = "pr-reviewer"
version = "0.1.0"
requires-python = ">=3.13"
description = "The one end-to-end proof app: wires the six asec-* packages over a tiny corpus. NOT production-grade."
dependencies = [
    "asec-core",
    "asec-sandbox",
    "asec-memory",
    "asec-skills",
    "asec-threat-model",
    "asec-confidence",
    "cyclopts",
    "anyio",
]

[project.scripts]
pr-reviewer = "pr_reviewer.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pr_reviewer"]
